[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

[wallpaper]
directory = "~/Pictures/Wallpapers"
fill_mode = "crop"
transition_duration = 1500

[wallpaper.automation]
enabled = true
interval_seconds = 300
order = "random"

[backdrop]
enabled = true
blur_intensity = 0.4
tint_intensity = 0.6

[location]
address = "Seattle, WA"

[weather]
enabled = true
unit = "celsius"

[notification]
background_opacity = 0.85

[audio]
enable_sounds = false

[idle]
pre_action_fade_seconds = 5.0

[idle.behavior.screen-off]
timeout = 600
action = "screen_off"
enabled = true

[idle.behavior.lock]
timeout = 660
action = "lock"
enabled = true

[idle.behavior.suspend]
timeout = 1800
action = "lock_and_suspend"
enabled = true

[plugins]
enabled = ["noctalia/screen_recorder"]

[bar.main]
position = "top"
background_opacity = 0.7
margin_ends = 0
margin_edge = 0
concave_edge_corners = true
radius_top_left = 0
radius_top_right = 0
radius_bottom_left = 12
radius_bottom_right = 12
capsule = true
widget_spacing = 6

start = ["clock", "group:sysmon", "active_window", "media"]
center = ["workspaces"]
end = ["noctalia/screen_recorder:recorder", "tray", "battery", "network", "volume", "control-center"]

[[bar.main.capsule_group]]
id = "sysmon"
members = ["cpu", "cpu-temp", "ram"]

[widget.clock]
format = "{:%H:%M %a, %b %d}"
tooltip_format = "{:%A, %B %d, %Y}"

[widget.cpu]
type = "sysmon"
stat = "cpu_usage"

[widget.cpu-temp]
type = "sysmon"
stat = "cpu_temp"

[widget.ram]
type = "sysmon"
stat = "ram_used"

[widget.media]
max_length = 145
artist_first = true

[widget.network]
show_label = false

[widget.volume]
show_label = false

[widget.workspaces]
hide_when_empty = true
labels_only_when_occupied = true
